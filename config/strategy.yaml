# Starter configuration — Adaptive AI Quant Trading Bot v2
# Values marked VALIDATE must not be trusted until research/backtest.py,
# research/walk_forward.py and research/monte_carlo.py have produced
# out-of-sample evidence for them. Everything here is read by
# quant/config.py — do not hard-code thresholds elsewhere.

universe:
  asset_class: us_equity
  min_avg_dollar_volume: 5000000     # 20-day avg $ volume floor
  exclude_halted: true
  exclude_abnormal_spreads: true
  max_spread_pct: 0.5                # reject quotes wider than this % — the
                                      # REAL threshold, used whenever
                                      # TRADING_MODE=live. Never loosen this
                                      # one for convenience.
  # Found 2026-08-24: this account's Alpaca data plan returns IEX-only quotes
  # (ax/bx both "V" in the raw quote), which run far wider than true
  # consolidated-market spreads — AYI, a liquid NYSE mid-cap, showed 5.3%
  # against a real threshold of a few cents. max_spread_pct alone would block
  # nearly every candidate regardless of setup quality, indefinitely, purely
  # on a data-plan artifact. This paper-mode-only override is read INSTEAD OF
  # max_spread_pct by scripts/quant_cli.py's cmd_evaluate whenever
  # cfg.is_live is False — it has NO effect once TRADING_MODE=live, by
  # construction (see quant/config.py's is_live), so it cannot silently carry
  # into real-money trading. The real fix is a paid Alpaca data subscription
  # (full SIP feed); revisit this value once that's in place.
  max_spread_pct_paper_only: 6.0

portfolio:
  max_positions: 6
  max_position_pct: 0.20
  max_new_trades_per_week: 3
  target_deployment_pct: [0.75, 0.85]

strategy:
  sleeves:
    momentum: true
    trend: true
    breakout: true
    mean_reversion: true
    relative_strength: true
  # regime -> sleeve weight (0 disables a sleeve for that regime)
  regime_weights:
    STRONG_TREND:  {momentum: 1.0, trend: 1.0, breakout: 1.0, mean_reversion: 0.0, relative_strength: 0.8}
    CHOPPY:        {momentum: 0.2, trend: 0.2, breakout: 0.3, mean_reversion: 1.0, relative_strength: 0.5}
    HIGH_VOL:      {momentum: 0.3, trend: 0.3, breakout: 0.2, mean_reversion: 0.4, relative_strength: 0.5}
    RISK_OFF:      {momentum: 0.0, trend: 0.0, breakout: 0.0, mean_reversion: 0.0, relative_strength: 0.0}
    TRANSITION:    {momentum: 0.4, trend: 0.4, breakout: 0.3, mean_reversion: 0.3, relative_strength: 0.4}
  # minimum_ensemble_score VALIDATED 2026-08-21: walk-forward on 10yrs/29
  # tickers at this threshold produced 15 windows, 543 OOS trades, positive
  # baseline expectancy, Monte Carlo median +2.2-20.6% return depending on
  # run, contained drawdown, survived combined-worst-case stress. See
  # memory/MODEL-LOG.md's 2026-08-21 entries.
  minimum_ensemble_score: 0.55
  minimum_ml_probability: VALIDATE   # e.g. start testing around 0.55
  reward_risk_minimum: 2.0

risk:
  max_risk_per_trade_pct: VALIDATE   # see quant/risk.py RISK_BUDGET_TABLE for starting ranges
  max_portfolio_heat_pct: VALIDATE   # e.g. start testing around 2.5-3.0% of equity
  volatility_adjustment: true
  correlation_adjustment: true
  max_correlated_cluster_risk_pct: 1.0   # cap on summed risk across correlated positions

no_trade:
  probability_threshold: VALIDATE
  min_regime_confidence: 0.4
  min_setup_quality: 60
  require_catalyst_verification: true
  # Deliberate decision, 2026-08-21: no champion ML model exists (four
  # separate training attempts found no tradeable edge in the data/features
  # tried so far -- see memory/MODEL-LOG.md). Rather than block all trading
  # indefinitely, fall back to the rule-based ensemble/regime engine alone,
  # gated on the VALIDATED minimum_ensemble_score above, with every other
  # gate (catalyst verification, regime confidence, liquidity, portfolio
  # concentration, reward:risk) still fully enforced. See
  # memory/TRADING-STRATEGY.md's "Champion/Challenger" section. Flip this
  # back to true once a model actually passes research/promotion.py.
  require_ml_probability: false

ml_model:
  target_r_multiple_win: 2.0
  target_r_multiple_loss: -1.0
  horizon_days: 10
  algo: logistic_regression   # logistic_regression | gradient_boosting

stops:
  initial_method: volatility_or_structure
  original_reference_trailing_stop_pct: 10
  winner_trail_1_pct: 7
  winner_trail_1_trigger_gain_pct: 15
  winner_trail_2_pct: 5
  winner_trail_2_trigger_gain_pct: 20
  hard_loss_cut_pct: 7

validation:
  walk_forward: true
  monte_carlo_runs: 10000
  stress_slippage_multipliers: [1.25, 1.50, 2.00]
  champion_challenger: true
  min_out_of_sample_trades: 30
  max_drawdown_increase_pct: 5.0

live_mode:
  default: paper
  require_production_gate: true
